[build]
  command = "npm install && cd Client && npm install && npm run build"
  publish = "Client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route all /api/* calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Serve index.html for all other routes (React SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

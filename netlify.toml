[build]
  command = "npm install && cd Client && npm install && npm run build"
  publish = "Client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Use esbuild so dependencies (e.g. axios v1, whose conditional exports the
# legacy bundler fails to resolve) are bundled into the function.
[functions]
  node_bundler = "esbuild"

# Route all /api/* calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Serve index.html for all other routes (React SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
